<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B2545" />
    <title>You are offline | WCE Logistics</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0b2545;
        color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 26em;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
        line-height: 1.15;
      }
      p {
        margin: 0;
        color: rgb(255 255 255 / 0.75);
        font-size: 16px;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 14px 24px;
        border-radius: 12px;
        background: #ff6b00;
        color: #0b2545;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Check your connection and try again. Your cart and orders are safe.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
