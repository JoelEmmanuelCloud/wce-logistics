services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wce_logistics
      POSTGRES_USER: wce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wce -d wce_logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/entrypoint.sh"]
    environment:
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Set STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Set STORAGE_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage-data:/data
      - ./infra/seaweedfs/entrypoint.sh:/opt/entrypoint.sh:ro

volumes:
  postgres-data:
  storage-data:
